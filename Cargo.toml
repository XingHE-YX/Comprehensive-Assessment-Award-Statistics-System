[package]
name = "zongce-web"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "=0.5.3"
askama = "=0.14.0"
askama_axum = "=0.4.0"
axum = { version = "=0.8.4", features = ["multipart", "macros"] }
chrono = { version = "=0.4.41", features = ["serde"] }
calamine = "=0.30.1"
csv = "=1.3.1"
quick-xml = "=0.37.5"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
dotenvy = "=0.15.7"
mime = "=0.3.17"
mime_guess = "=2.0.5"
multer = "=3.1.0"
password-hash = "=0.5.0"
rand = "=0.9.1"
rust_xlsxwriter = "=0.89.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros", "chrono", "json"] }
subtle = "=2.6.1"
thiserror = "=2.0.12"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower = "=0.5.2"
tower-http = { version = "=0.6.6", features = ["fs", "trace", "request-id", "timeout"] }
tower-sessions = { version = "=0.14.0", features = ["private"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt", "json"] }
urlencoding = "=2.1.3"
uuid = { version = "=1.17.0", features = ["v4", "fast-rng"] }

[dev-dependencies]
axum-test = "=17.2.0"
tempfile = "=3.20.0"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "test-util"] }
